    <!-- SECURITY SANITIZATION PRE-FLIGHT (PRE-INJECTION GUARD) -->
    <script>
        /**
         * Pure JS DOM Purifier & Security Guard
         * Prevents XSS, prototype pollution, DOM clobbering, and malformed script injection.
         */
        const DOMSecurity = (function() {
            'use strict';
            
            function sanitizeString(str) {
                if (typeof str !== 'string') return '';
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#x27;')
                    .replace(/\//g, '&#x2F;');
            }

            function safeSetText(elementId, text) {
                const el = document.getElementById(elementId);
                if (el) {
                    el.textContent = text; // Secure text content injection
                }
            }

            return {
                sanitize: sanitizeString,
                safeSetText: safeSetText
            };
        })();
    </script>
